name: Build Madeira IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_ID: com.NotBoodiOS.madeira
  LLVM_MINGW_TAG: "20260421"
  IOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  build:
    name: Build Madeira IPA
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euxo pipefail

          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          brew update
          brew install \
            bison \
            cmake \
            ninja \
            meson \
            nasm \
            python-setuptools \
            libtool \
            pkg-config

          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm-mingw)/bin" >> "$GITHUB_PATH"

      - name: Prepare PATH
        run: |
          set -euxo pipefail

          export PATH="$(brew --prefix bison)/bin:$PATH"

          if [ -d "$(brew --prefix llvm-mingw)/bin" ]; then
            export PATH="$(brew --prefix llvm-mingw)/bin:$PATH"
          fi

          if [ -d "$(brew --prefix llvm)/bin" ]; then
            export PATH="$(brew --prefix llvm)/bin:$PATH"
          fi

          echo "PATH=$PATH"

          command -v bison
          command -v cmake
          command -v ninja
          command -v meson
          command -v nasm

      - name: Prepare llvm-mingw
        id: llvm-mingw
        run: |
          set -euxo pipefail

          LLVM_MINGW_DIR="$RUNNER_TEMP/llvm-mingw"
          LLVM_MINGW_ARCHIVE="$RUNNER_TEMP/llvm-mingw.tar.xz"

          if [ ! -d "$LLVM_MINGW_DIR" ]; then
            mkdir -p "$LLVM_MINGW_DIR"

            curl -L \
              --retry 5 \
              --retry-all-errors \
              -o "$LLVM_MINGW_ARCHIVE" \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/llvm-mingw-${LLVM_MINGW_TAG}-ucrt-aarch64.tar.xz"

            tar -xJf "$LLVM_MINGW_ARCHIVE" \
              --strip-components=1 \
              -C "$LLVM_MINGW_DIR"
          fi

          echo "LLVM_MINGW_DIR=$LLVM_MINGW_DIR" >> "$GITHUB_ENV"

          echo "$LLVM_MINGW_DIR/bin" >> "$GITHUB_PATH"

      - name: Prepare native build cache
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            toolchains/gnutls-ios
            build/freetype-ios/build
            build/ntdll-unix/obj
            build/win32u-unix/obj
            build/wineserver-ios/build
          key: ${{ runner.os }}-native-${{ hashFiles('build/gnutls-ios/**', 'build/freetype-ios/**', 'build/ntdll-unix/**', 'build/win32u-unix/**', 'build/wineserver-ios/**', 'wine/**') }}

      - name: Build Wine ARM64EC/ARM64 PE tree
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          export PATH="$(brew --prefix bison)/bin:$PATH"

          if [ ! -f wine/build-arm64ec/Makefile ]; then
            rm -rf wine/build-arm64ec
            mkdir -p wine/build-arm64ec

            cd wine/build-arm64ec

            ../configure \
              --enable-archs=arm64ec,aarch64 \
              --without-x \
              --without-freetype
          fi

          # Generate Wine's IDL-derived headers first. This includes
          # dwrite.h and related DirectWrite headers required by the
          # Madeira native iOS dwrite unixlib.
          make -j"$(sysctl -n hw.ncpu)" include

          # The ARM64EC PE ntdll build is required by the Madeira
          # native iOS build.
          make -j"$(sysctl -n hw.ncpu)" dlls/ntdll

      - name: Verify Wine ARM64EC build tree
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          test -f wine/build-arm64ec/Makefile
          test -f wine/build-arm64ec/include/config.h

          echo "Wine build tree:"
          echo "  wine/build-arm64ec/Makefile"
          echo "  wine/build-arm64ec/include/config.h"

          echo "Generated DirectWrite headers:"
          find wine/build-arm64ec wine -name 'dwrite*.h' -print

      - name: Build GnuTLS, FreeType and Unix Wine libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          echo "=== Building GnuTLS ==="
          bash build/gnutls-ios/build.sh

          echo ""
          echo "=== Preparing FreeType 2.13.3 ==="

          if [ ! -d research/freetype ]; then
            git clone \
              --depth 1 \
              --branch VER-2-13-3 \
              https://github.com/freetype/freetype.git \
              research/freetype
          fi

          test -f research/freetype/CMakeLists.txt

          echo ""
          echo "=== Building FreeType ==="
          bash build/freetype-ios/build.sh

          test -s build/freetype-ios/build/libfreetype.a

          echo ""
          echo "=== Verifying Wine build configuration ==="
          test -f wine/build-arm64ec/include/config.h

          echo ""
          echo "=== Building ntdll Unix ==="
          bash build/ntdll-unix/build.sh

          echo ""
          echo "=== Building win32u Unix ==="
          bash build/win32u-unix/build.sh

          echo ""
          echo "=== Building wineserver ==="
          bash build/wineserver-ios/build.sh

      - name: Build FEX
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          bash build/fex-ios/build.sh

      - name: Build DXMT
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          bash build/dxmt-ios/build.sh

      - name: Verify VC++ runtime
        run: |
          set -euxo pipefail

          echo "=== Checking VC++ runtime ==="

          if [ -d "research/vcruntime" ]; then
            find research/vcruntime -maxdepth 3 -type f -print
          fi

          if [ -d "app/Madeira/vcruntime" ]; then
            find app/Madeira/vcruntime -maxdepth 3 -type f -print
          fi

      - name: Validate native libraries
        run: |
          set -euxo pipefail

          echo "=== Validating native libraries ==="

          test -s build/freetype-ios/build/libfreetype.a
          test -s app/Madeira/libntdll_unix.a
          test -s app/Madeira/libwin32u_unix.a

          echo "Native libraries:"
          ls -lh \
            build/freetype-ios/build/libfreetype.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libwin32u_unix.a

          echo ""
          echo "Architectures:"
          lipo -info build/freetype-ios/build/libfreetype.a || true
          lipo -info app/Madeira/libntdll_unix.a || true
          lipo -info app/Madeira/libwin32u_unix.a || true

      - name: Build unsigned Madeira app
        run: |
          set -euxo pipefail

          echo "=== Building unsigned Xcode application ==="

          xcodebuild \
            -project app/Madeira/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            build

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          echo "=== Packaging IPA ==="

          APP_PATH="$(find "$PWD" \
            -path '*/Build/Products/Release-iphoneos/*.app' \
            -type d \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find built .app"
            find "$PWD" -path '*Release-iphoneos*' -print
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          rm -f Madeira-unsigned.ipa

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload \
            Madeira-unsigned.ipa

          test -s Madeira-unsigned.ipa

          echo ""
          echo "IPA:"
          ls -lh Madeira-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-IPA
          path: Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
