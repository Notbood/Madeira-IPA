name: Build Madeira IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

# This workflow builds the same stack described by upstream Madeira:
# Wine native/ARM64EC pieces -> FEX -> DXMT -> Xcode app -> unsigned IPA.
#
# IMPORTANT:
# - The IPA is unsigned. Sign it with your own Apple ID using AltStore,
#   SideStore, Sideloadly, etc.
# - Microsoft VC++ runtime DLLs are intentionally NOT downloaded by this
#   workflow. See the note in the "Supply VC runtime" step.
# - A cold build is very large; caches are used for the native build trees.

env:
  BUNDLE_ID: com.NotBoodiOS.madeira
  LLVM_MINGW_TAG: "20260421"
  IOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout Madeira with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Pin Xcode rather than relying on whatever Xcode happens to be
      # selected on the runner. The old workflow failed before compilation
      # because its xcodebuild did not implement -downloadComponent.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show toolchain versions
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          clang --version
          cmake --version
          ninja --version
          python3 --version

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          brew install bison cmake ninja meson nasm python-setuptools libtool pkg-config

      # llvm-mingw supplies the ARM64EC PE compiler used by Wine/DXMT.
      - name: Cache llvm-mingw
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: toolchains/llvm-mingw
          key: madeira-llvm-mingw-${{ env.LLVM_MINGW_TAG }}-macos-universal

      - name: Install llvm-mingw
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p toolchains
          curl -fL \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/llvm-mingw-${LLVM_MINGW_TAG}-ucrt-macos-universal.tar.xz" \
            -o /tmp/llvm-mingw.tar.xz
          tar -xJf /tmp/llvm-mingw.tar.xz -C /tmp
          rm -rf toolchains/llvm-mingw
          mv "/tmp/llvm-mingw-${LLVM_MINGW_TAG}-ucrt-macos-universal" toolchains/llvm-mingw

      - name: Add toolchains to PATH
        run: |
          set -euxo pipefail
          # Homebrew's bison is keg-only on macOS because Apple ships an
          # older /usr/bin/bison. Wine requires bison >= 3.0, so put the
          # Homebrew version first on PATH for configure/build steps.
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/llvm-mingw/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/llvm-mingw" >> "$GITHUB_PATH"
          echo "$HOMEBREW_PREFIX/opt/libtool/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Verify ARM64EC compiler
        run: |
          set -euxo pipefail
          command -v arm64ec-w64-mingw32-clang
          command -v arm64ec-w64-mingw32-widl
          arm64ec-w64-mingw32-clang --version
          arm64ec-w64-mingw32-widl --version || true

      - name: Compute source/submodule cache key
        id: source
        run: |
          set -euxo pipefail
          echo "sha=$(git submodule status --recursive | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache Madeira native build products
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            FEX/build-ios
            wine/build-arm64ec
            build/gnutls-ios/obj
            build/freetype-ios/obj
            build/ntdll-unix/obj
            build/win32u-unix/obj
            build/wineserver/obj
            build/dxmt-ios/obj
            build/dxmt-ios/shader-headers
            build/dxmt-ios/libdxmt_unix.a
            build/dxmt-ios/libdxmt_combined.a
            app/Madeira/libntdll_unix.a
            app/Madeira/libwin32u_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libdxmt_combined.a
          key: madeira-native-${{ steps.source.outputs.sha }}-xcode16.4

      # The previous workflow used:
      #   xcodebuild -downloadComponent MetalToolchain
      # which is not a valid option on the xcodebuild shipped by the
      # failing runner. Do not call it here.
      #
      # DXMT's own build machinery is responsible for using the installed
      # Metal toolchain.

      # Do NOT build a generic Wine macOS host tree here. Madeira's iOS fork
      # adds iOS-specific unix-side symbols (for example the win32u srcwatch
      # hooks), and the generic Wine host link does not provide them. The
      # official build is split into dedicated iOS native-library scripts.

      - name: Build Wine ARM64EC/ARM64 PE tree
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          if [ ! -f wine/build-arm64ec/Makefile ]; then
            rm -rf wine/build-arm64ec
            mkdir -p wine/build-arm64ec
            cd wine/build-arm64ec
            ../configure \
              --enable-archs=arm64ec,aarch64 \
              --without-x \
              --without-freetype
          fi

          # The upstream Madeira handoff identifies the ARM64EC PE ntdll
          # build as a required step.
          # configure above leaves this shell inside wine/build-arm64ec.
          make -j"$(sysctl -n hw.ncpu)" dlls/ntdll

      # Wine's generated Windows headers are required by the unix-side
      # dwrite build. Generate them from the Wine IDL files before ntdll-unix.
      - name: Generate required Wine headers
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          WINE_SRC="$GITHUB_WORKSPACE/wine"
          WINE_WINDOWS="$WINE_SRC/include/wine/windows"
          WIDL="$(command -v arm64ec-w64-mingw32-widl)"

          test -x "$WIDL"
          mkdir -p "$WINE_WINDOWS"

          echo "Using widl: $WIDL"
          echo "Wine source: $WINE_SRC"
          echo "Wine Windows headers: $WINE_WINDOWS"

          generated=0

          for idl in "$WINE_SRC"/include/*.idl; do
            [ -f "$idl" ] || continue

            name="$(basename "$idl" .idl)"
            output="$WINE_WINDOWS/${name}.h"

            echo "Generating $output from $idl"

            if "$WIDL" \
              -I"$WINE_SRC/include" \
              -I"$WINE_WINDOWS" \
              -h \
              -o "$output" \
              "$idl"; then
              generated=$((generated + 1))
            else
              echo "WARNING: widl failed for $idl"
              rm -f "$output"
            fi
          done

          echo "Generated $generated Wine headers."

          echo "=== Required Wine headers ==="
          find "$WINE_WINDOWS" \
            \( -name 'dwrite.h' \
            -o -name 'objidlbase.h' \
            -o -name 'unknwn.h' \) \
            -print

          test -s "$WINE_WINDOWS/dwrite.h"
          test -s "$WINE_WINDOWS/objidlbase.h"
          test -s "$WINE_WINDOWS/unknwn.h"

          echo "Required Wine headers are present."

      # Freetype source is not part of the repository checkout. The
      # freetype-ios build script expects research/freetype to exist.
      - name: Clone Freetype source
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          if [ ! -d research/freetype ]; then
            mkdir -p research
            git clone --depth 1 --branch VER-2-13-3 \
              https://github.com/freetype/freetype.git \
              research/freetype
          fi

          test -f research/freetype/include/ft2build.h
          echo "Freetype source is ready."

      - name: Build GnuTLS, Freetype and Unix Wine libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash build/gnutls-ios/build.sh
          bash build/freetype-ios/build.sh
          bash build/ntdll-unix/build.sh
          bash build/win32u-unix/build.sh
          bash build/wineserver/build.sh

      - name: Build FEX for iOS
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          # FEX is an iOS fork in this repository. The upstream Madeira
          # handoff confirms FEX/build-ios as the required native tree.
          #
          # Keep this configuration explicit so CMake cannot silently build
          # a macOS host target.
          cmake -S FEX -B FEX/build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_STATIC_LIBS=ON \
            -DBUILD_TESTING=OFF

          cmake --build FEX/build-ios -j"$(sysctl -n hw.ncpu)"

      - name: Build DXMT for iOS
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          # Upstream Madeira identifies build/dxmt-ios/build.sh + libtool
          # combination as the DXMT build chain. Do not substitute the
          # generic upstream DXMT macOS build.
          bash build/dxmt-ios/build.sh

          if [ -f build/dxmt-ios/libdxmt_unix.a ] && \
             [ -f build/dxmt-ios/libdxmt_combined.a ]; then
            echo "DXMT static libraries were produced."
          else
            echo "ERROR: DXMT build completed without the expected static libraries."
            find build/dxmt-ios -maxdepth 2 -type f -print | sort || true
            exit 1
          fi

      - name: Supply VC++ runtime folder
        run: |
          set -euxo pipefail
          mkdir -p app/Madeira/x86_64-vcruntime

          # Madeira intentionally does not ship Microsoft's VC++ runtime DLLs.
          # Do NOT put arbitrary DLLs here. Obtain the unmodified redistributable
          # separately under Microsoft's redistribution terms, then place the
          # required DLLs in app/Madeira/x86_64-vcruntime before running this
          # workflow.
          #
          # We fail here instead of producing an IPA with an empty runtime
          # directory, because that IPA would not be a meaningful build.
          shopt -s nullglob
          dlls=(app/Madeira/x86_64-vcruntime/*.dll)
          if [ "${#dlls[@]}" -eq 0 ]; then
            echo "No VC++ runtime DLLs found."
            echo "See tools/fetch-vcruntime.md in the Madeira source tree."
            echo "Supply the required unmodified Microsoft redistributables and rerun."
            exit 1
          fi
          printf '%s\n' "${dlls[@]}"

      - name: Verify required native libraries
        run: |
          set -euxo pipefail
          required=(
            app/Madeira/libntdll_unix.a
            app/Madeira/libwin32u_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libdxmt_combined.a
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "Missing/empty: $f"; exit 1; }
            file "$f"
          done

      - name: Show Xcode project targets
        run: |
          set -euxo pipefail
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -list

      - name: Build Madeira app (unsigned)
        run: |
          set -euxo pipefail
          rm -rf derived

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}"

      - name: Locate and validate Madeira.app
        run: |
          set -euxo pipefail
          APP_PATH="$(find derived/Build/Products -maxdepth 3 -type d -name Madeira.app -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Madeira"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built app: $APP_PATH"
          file "$APP_PATH/Madeira"

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          rm -rf Payload Madeira.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Madeira.app
          /usr/bin/zip -qry Madeira.ipa Payload
          rm -rf Payload

          test -s Madeira.ipa
          ls -lh Madeira.ipa
          shasum -a 256 Madeira.ipa | tee Madeira.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned
          path: |
            Madeira.ipa
            Madeira.ipa.sha256
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "# Madeira IPA build"
            echo
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo "**Xcode:**"
            xcodebuild -version | head -2
            echo
            if [ -f Madeira.ipa ]; then
              echo "**IPA:** generated"
              echo "**SHA-256:** \`$(shasum -a 256 Madeira.ipa | awk '{print $1}')\`"
              echo "**Size:** $(du -h Madeira.ipa | awk '{print $1}')"
            else
              echo "**IPA:** not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
