name: Build Madeira IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_ID: com.NotBoodiOS.madeira
  LLVM_MINGW_TAG: "20260421"
  IOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------
      # Xcode
      # ------------------------------------------------------------
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      # ------------------------------------------------------------
      # Homebrew dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -euxo pipefail

          brew update

          brew install \
            bison \
            cmake \
            ninja \
            meson \
            nasm \
            python-setuptools \
            libtool \
            pkg-config

      # ------------------------------------------------------------
      # PATH setup
      # ------------------------------------------------------------
      - name: Configure PATH
        run: |
          set -euxo pipefail

          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libtool)/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # Prepare llvm-mingw
      #
      # IMPORTANT:
      # macOS uses the macos-universal archive.
      # Do NOT use the aarch64 archive here.
      # ------------------------------------------------------------
      - name: Prepare llvm-mingw
        run: |
          set -euxo pipefail

          LLVM_MINGW_DIR="$RUNNER_TEMP/llvm-mingw"
          LLVM_MINGW_ARCHIVE="$RUNNER_TEMP/llvm-mingw.tar.xz"

          rm -rf "$LLVM_MINGW_DIR"
          mkdir -p "$LLVM_MINGW_DIR"

          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/llvm-mingw-${LLVM_MINGW_TAG}-ucrt-macos-universal.tar.xz"

          echo "========================================"
          echo "Downloading llvm-mingw"
          echo "========================================"
          echo "Version: $LLVM_MINGW_TAG"
          echo "URL: $LLVM_MINGW_URL"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            -o "$LLVM_MINGW_ARCHIVE" \
            "$LLVM_MINGW_URL"

          echo "========================================"
          echo "Downloaded llvm-mingw archive"
          echo "========================================"

          ls -lh "$LLVM_MINGW_ARCHIVE"
          file "$LLVM_MINGW_ARCHIVE"

          ARCHIVE_SIZE="$(stat -f%z "$LLVM_MINGW_ARCHIVE")"

          echo "Archive size: $ARCHIVE_SIZE bytes"

          if [ "$ARCHIVE_SIZE" -lt 1000000 ]; then
            echo "ERROR: llvm-mingw archive is suspiciously small."
            exit 1
          fi

          tar -xJf "$LLVM_MINGW_ARCHIVE" \
            --strip-components=1 \
            -C "$LLVM_MINGW_DIR"

          echo "========================================"
          echo "llvm-mingw extracted"
          echo "========================================"

          test -x "$LLVM_MINGW_DIR/bin/aarch64-w64-mingw32-clang"

          "$LLVM_MINGW_DIR/bin/aarch64-w64-mingw32-clang" --version

          echo "$LLVM_MINGW_DIR/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # Native build cache
      # ------------------------------------------------------------
      - name: Restore native build cache
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            build
            toolchains
            app/Madeira/*.a
            app/Madeira/*.dylib
            app/Madeira/*.framework
          key: madeira-native-${{ runner.os }}-${{ hashFiles('build/**/*.sh', 'build/**/*.c', 'build/**/*.h', 'wine/**/*.h', 'wine/**/*.c') }}
          restore-keys: |
            madeira-native-${{ runner.os }}-

      # ------------------------------------------------------------
      # Build Wine ARM64EC / ARM64 PE tree
      # ------------------------------------------------------------
      - name: Configure Wine ARM64EC
        working-directory: wine
        run: |
          set -euxo pipefail

          rm -rf build-arm64ec

          mkdir -p build-arm64ec

          cd build-arm64ec

          ../configure \
            --enable-archs=arm64ec,aarch64 \
            --without-x \
            --without-freetype

      # ------------------------------------------------------------
      # Generate Wine headers / IDL output
      #
      # IMPORTANT:
      # `dwrite.h` is generated by Wine's include target.
      # This must happen BEFORE dlls/ntdll.
      # ------------------------------------------------------------
      - name: Generate Wine headers
        working-directory: wine/build-arm64ec
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Generating Wine include files"
          echo "========================================"

          make -j"$(sysctl -n hw.ncpu)" include

          echo "========================================"
          echo "Checking for dwrite.h"
          echo "========================================"

          find . .. -name 'dwrite*.h' -print

          if ! find . .. -name 'dwrite.h' -print -quit | grep -q .; then
            echo "ERROR: dwrite.h was not generated."
            exit 1
          fi

      # ------------------------------------------------------------
      # Build ntdll PE
      # ------------------------------------------------------------
      - name: Build Wine ntdll
        working-directory: wine/build-arm64ec
        run: |
          set -euxo pipefail

          make -j"$(sysctl -n hw.ncpu)" dlls/ntdll

      # ------------------------------------------------------------
      # Verify generated Wine configuration
      # ------------------------------------------------------------
      - name: Verify Wine build
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Wine build verification"
          echo "========================================"

          test -f wine/build-arm64ec/include/config.h

          echo "config.h:"
          ls -lh wine/build-arm64ec/include/config.h

          echo ""
          echo "Generated dwrite headers:"
          find wine/build-arm64ec wine -name 'dwrite*.h' -print

      # ------------------------------------------------------------
      # Build GnuTLS
      # ------------------------------------------------------------
      - name: Build GnuTLS
        run: |
          set -euxo pipefail

          chmod +x build/gnutls-ios/build.sh
          build/gnutls-ios/build.sh

      # ------------------------------------------------------------
      # Prepare FreeType source
      # ------------------------------------------------------------
      - name: Prepare FreeType source
        run: |
          set -euxo pipefail

          rm -rf research/freetype

          mkdir -p research

          git clone \
            --depth 1 \
            --branch VER-2-13-3 \
            https://github.com/freetype/freetype.git \
            research/freetype

          test -f research/freetype/include/freetype/freetype.h

      # ------------------------------------------------------------
      # Build FreeType for iOS
      # ------------------------------------------------------------
      - name: Build FreeType
        run: |
          set -euxo pipefail

          chmod +x build/freetype-ios/build.sh
          build/freetype-ios/build.sh

      # ------------------------------------------------------------
      # Build ntdll unix library
      # ------------------------------------------------------------
      - name: Build ntdll unix
        run: |
          set -euxo pipefail

          chmod +x build/ntdll-unix/build.sh
          build/ntdll-unix/build.sh

      # ------------------------------------------------------------
      # Build win32u unix library
      # ------------------------------------------------------------
      - name: Build win32u unix
        run: |
          set -euxo pipefail

          chmod +x build/win32u-unix/build.sh
          build/win32u-unix/build.sh

      # ------------------------------------------------------------
      # Build wineserver
      # ------------------------------------------------------------
      - name: Build wineserver
        run: |
          set -euxo pipefail

          chmod +x build/wineserver-ios/build.sh
          build/wineserver-ios/build.sh

      # ------------------------------------------------------------
      # Build FEX
      # ------------------------------------------------------------
      - name: Build FEX
        run: |
          set -euxo pipefail

          chmod +x build/fex-ios/build.sh
          build/fex-ios/build.sh

      # ------------------------------------------------------------
      # Build DXMT
      # ------------------------------------------------------------
      - name: Build DXMT
        run: |
          set -euxo pipefail

          chmod +x build/dxmt-ios/build.sh
          build/dxmt-ios/build.sh

      # ------------------------------------------------------------
      # Verify VC++ runtime
      # ------------------------------------------------------------
      - name: Verify VC++ runtime
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Searching for VC++ runtime"
          echo "========================================"

          find . \
            \( -iname 'vcruntime*.dll' \
            -o -iname 'msvcp*.dll' \
            -o -iname 'ucrtbase*.dll' \) \
            -print

      # ------------------------------------------------------------
      # Validate native libraries
      # ------------------------------------------------------------
      - name: Validate native libraries
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Validating native libraries"
          echo "========================================"

          find app/Madeira \
            -maxdepth 2 \
            -type f \
            \( -name '*.a' -o -name '*.dylib' -o -name '*.framework' \) \
            -print

          echo ""
          echo "Checking libntdll_unix.a"

          test -f app/Madeira/libntdll_unix.a

          ls -lh app/Madeira/libntdll_unix.a

          file app/Madeira/libntdll_unix.a

      # ------------------------------------------------------------
      # Build unsigned Xcode application
      # ------------------------------------------------------------
      - name: Build unsigned iOS app
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Building unsigned Madeira iOS app"
          echo "========================================"

          xcodebuild \
            -project Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            clean build

      # ------------------------------------------------------------
      # Locate built .app
      # ------------------------------------------------------------
      - name: Locate application
        id: locate-app
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Searching for Madeira.app"
          echo "========================================"

          APP_PATH="$(find . -type d -name 'Madeira.app' -path '*Build/Products/Release-iphoneos/*' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Madeira.app was not found."
            find . -type d -name '*.app' -print
            exit 1
          fi

          echo "Found:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Package unsigned IPA
      # ------------------------------------------------------------
      - name: Package IPA
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Packaging unsigned IPA"
          echo "========================================"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/Madeira.app

          rm -rf Madeira-unsigned.ipa

          /usr/bin/zip \
            -qry \
            Madeira-unsigned.ipa \
            Payload

          echo ""
          echo "IPA created:"
          ls -lh Madeira-unsigned.ipa

          file Madeira-unsigned.ipa

      # ------------------------------------------------------------
      # Upload IPA
      # ------------------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-IPA
          path: Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
